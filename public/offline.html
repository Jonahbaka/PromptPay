<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#09121b">
  <title>PromptPay | Offline</title>
  <style>
    :root {
      color-scheme: dark;
      --surface: rgba(12, 22, 32, 0.96);
      --border: rgba(140, 170, 194, 0.16);
      --text: #f2f7fb;
      --muted: #91a4b7;
      --accent: #17bf80;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: "Aptos", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(23, 191, 128, 0.14), transparent 34%),
        linear-gradient(180deg, #07111a 0%, #040d15 100%);
      color: var(--text);
    }

    .card {
      width: min(100%, 28rem);
      padding: 2rem;
      border-radius: 1.6rem;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 24px 60px rgba(3, 8, 14, 0.42);
    }

    .eyebrow {
      margin: 0 0 0.65rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.72rem;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 2.8rem);
      line-height: 0.98;
      letter-spacing: -0.05em;
    }

    p {
      margin: 1rem 0 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    button,
    a {
      min-height: 2.9rem;
      padding: 0 1.1rem;
      border-radius: 999px;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    button {
      background: linear-gradient(135deg, #17bf80, #12d39a);
      color: #02130d;
    }

    a {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(140, 170, 194, 0.16);
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">PromptPay status</p>
    <h1>You are offline</h1>
    <p>
      PromptPay's operator surface, docs, and network views will resume when connectivity returns.
      Your browser can retry automatically as soon as the network is back.
    </p>
    <div class="actions">
      <button type="button" onclick="window.location.reload()">Retry</button>
      <a href="mailto:support@upromptpay.com">Contact PromptPay</a>
    </div>
  </div>
</body>
</html>
